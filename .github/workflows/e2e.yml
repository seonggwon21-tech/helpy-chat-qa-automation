# 대상 서비스(qaproject.elice.io)에 실제로 접속하는 E2E 파이프라인.
# 서비스 가용성·테스트 계정 자격증명에 의존하므로 push 트리거에서 분리하고
# 필요할 때만 수동(workflow_dispatch)으로 실행한다.
name: E2E (manual)

on:
  workflow_dispatch:
    inputs:
      suite:
        description: '실행할 스위트'
        type: choice
        default: all
        options: [all, api, ui]

jobs:
  api-tests:
    name: API Tests
    if: inputs.suite == 'all' || inputs.suite == 'api'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Create Allure executor info
        run: |
          mkdir -p allure-results
          cat > allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}",
            "buildOrder": ${{ github.run_number }},
            "buildName": "#${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Allure Report"
          }
          EOF

      - name: Run API tests
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          BASE_API_URL: ${{ secrets.BASE_API_URL }}
        run: python -m pytest -m api --tb=short -v --junitxml=result-api.xml --alluredir=allure-results

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            result-api.xml
            allure-results/

  ui-tests:
    name: UI Tests
    if: inputs.suite == 'all' || inputs.suite == 'ui'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Create Allure executor info
        run: |
          mkdir -p allure-results
          cat > allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}",
            "buildOrder": ${{ github.run_number }},
            "buildName": "#${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Allure Report"
          }
          EOF

      - name: Run UI tests
        env:
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_PW: ${{ secrets.TEST_USER_PW }}
        run: python -m pytest -m "ui and not slow" --tb=short -v --junitxml=result-ui.xml --alluredir=allure-results

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            result-ui.xml
            allure-results/
            reports/
